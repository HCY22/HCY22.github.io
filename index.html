
<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
<title>萬事屋</title>
<style>

	button {
		display: none;
		width: 50%;
		height: 10%;
		padding: 16px 0;
		margin: auto 0;
	}
</style>
</head>
<body>
    <button id="btnShare" onclick="sendShare_Pay()" style="display: none;margin: 20px auto;padding: 20px;">Pay</button>
    <button id="btnLogin" onclick="liff.login()" style="display: none;margin: 20px auto;padding: 20px;">Log In</button>
	<button id="btnLogOut" onclick="logOut()" style="display: none;margin: 20px auto;padding: 20px;">Log Out</button>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        async function sendShare_Pay() {
			
			name = await liff.getProfile().then((profile) => {
				return profile.displayName;
			}).catch((err) => {
				return err;
			});
				
			const result = await liff.shareTargetPicker([
				{
					type: "flex",
					altText: "已收到NT$ 2000的轉帳。",
					contents: {
		                        type: "bubble",
		                        size: "hecto",
		                        hero: {
		                            type: "image",
		                            url: "https://i.imgur.com/j5VkCxE.png",
		                            size: "full",
		                            aspectRatio: "20:13",
		                            aspectMode: "cover",
		                            action: {
		                            type: "uri",
		                            uri: "https://line.me/R/pay/"
		                            },
		                            position: "relative"
		                        },
		                        body: {
		                            type: "box",
		                            layout: "vertical",
		                            contents: [
		                            {
		                                type: "text",
		                                text: "LINE Pay",
		                                weight: "bold",
		                                size: "xs",
		                                action: {
		                                type: "uri",
		                                label: "action",
		                                uri: "https://line.me/R/pay/"
		                                }
		                            },
		                            {
		                                type: "text",
		                                text: "您已收到 NT$ 2000。（來自："+ userDisplayName +"）",
		                                size: "xs",
		                                contents: [],
		                                color: "#8E8E8E",
		                                action: {
		                                type: "uri",
		                                label: "action",
		                                uri: "https://line.me/R/pay/"
		                                },
		                                wrap: true
		                            },
		                            {
		                                type: "button",
		                                position: "relative",
		                                style: "secondary",
		                                height: "sm",
		                                margin: "lg",
		                                color: "#F0F0F0",
		                                scaling: true,
		                                offsetEnd: "none",
		                                action: {
		                                type: "uri",
		                                label: "瞭解更多",
		                                uri: "https://line.me/R/pay/"
		                                }
		                            }
		                            ],
		                            action: {
		                            type: "uri",
		                            label: "action",
		                            uri: "https://line.me/R/pay/"
		                            }
		                        },
		                        footer: {
		                            type: "box",
		                            layout: "baseline",
		                            contents: [
		                            {
		                                type: "icon",
		                                url: "https://i.imgur.com/LriSrg0.png",
		                                margin: "none",
		                                size: "xs",
		                                scaling: true,
		                                offsetTop: "xs"
		                            },
		                            {
		                                type: "text",
		                                text: "LINE Pay",
		                                margin: "sm",
		                                size: "xxs",
		                                color: "#8E8E8E"
		                            },
		                            {
		                                type: "icon",
		                                url: "https://i.imgur.com/aKbXQ9D.png",
		                                margin: "sm",
		                                size: "xxs",
		                                offsetTop: "xs"
		                            }
		                            ],
		                            position: "relative",
		                            action: {
		                            type: "uri",
		                            label: "action",
		                            uri: "https://line.me/R/pay/"
		                            }
		                        },
		                        styles: {
		                            footer: {
		                            separator: true
		                            }
		                        }
					}
				}
			])

			if (result) {
				alert(`[${result.status}] Message sent!`)
			} else {
				const [majorVer, minorVer, patchVer] = (liff.getLineVersion() || "").split('.');

				if (minorVer === undefined) {
					alert('ShareTargetPicker was canceled in external browser')
					return
				}

				if (parseInt(majorVer) >= 10 && parseInt(minorVer) >= 10 && parseInt(patchVer) > 0) {
					alert('ShareTargetPicker was canceled in LINE app')
				}
			}

		}
	    
		function logOut() {
			liff.logout()
			window.location.reload()
		}

		async function main() {
			await liff.init({ liffId: "2006888326-Lg6n55jd" })
			if (liff.isLoggedIn()) {
				document.getElementById("btnShare").style.display = "block"
				if (!liff.isInClient()) {
					document.getElementById("btnLogOut").style.display = "block"
				}
			} else {
				document.getElementById("btnLogin").style.display = "block"
			}
		}

        main()
    </script>
</body>
</html>
